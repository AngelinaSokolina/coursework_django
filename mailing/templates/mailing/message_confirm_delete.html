{% extends 'mailing/base.html' %}

{% block title %}Удалить сообщение{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 40px auto 0; text-align: center;">
    <h2 class="fw-bold mb-3">Удалить сообщение</h2>
    <p class="h4 fw-normal">"{{ message.subject }}"</p>
    <p class="text-muted">Это действие нельзя отменить.</p>

    <form method="post" class="mt-3">
        {% csrf_token %}
        <div class="d-flex justify-content-center gap-3">
            <button type="submit" class="btn btn-danger px-4">Удалить</button>
            <a href="{% url 'mailing:message_list' %}" class="btn btn-outline-secondary px-4">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}

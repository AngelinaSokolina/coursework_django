{% extends 'mailing/base.html' %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 60px auto;">
    <h2 class="fw-bold mb-4 text-center">Восстановление пароля</h2>
    <form method="post" class="bg-white p-4 rounded-4 shadow-sm">
        {% csrf_token %}
        <div class="mb-4">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Отправить</button>
    </form>
    <p class="mt-3 text-center"><a href="{% url 'users:login' %}">Вернуться ко входу</a></p>
</div>
{% endblock %}

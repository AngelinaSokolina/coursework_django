{% extends 'mailing/base.html' %}

{% block title %}Детали сообщения{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm rounded-4 p-4 bg-white" style="max-width: 600px; margin: 0 auto;">
    <h2 class="fw-bold mb-4">{{ message.subject }}</h2>

    <div class="mb-2">
        <span class="fw-semibold">Тема:</span>
        <span>{{ message.subject }}</span>
    </div>
    <div class="mb-4">
        <span class="fw-semibold">Текст:</span>
        <p class="text-muted mt-1">{{ message.body|linebreaks }}</p>
    </div>

    <div class="d-flex flex-wrap gap-2 pt-3 border-top">
        <a href="{% url 'mailing:message_update' message.pk %}" class="btn btn-outline-success">Редактировать</a>
        <a href="{% url 'mailing:message_delete' message.pk %}" class="btn btn-outline-danger">Удалить</a>
        <a href="{% url 'mailing:message_list' %}" class="btn btn-outline-primary ms-auto">Назад</a>
    </div>
</div>
{% endblock %}

{% extends 'mailing/base.html' %}

{% block title %}Список сообщений{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">Сообщения</h2>
    <a href="{% url 'mailing:message_create' %}" class="btn btn-success">Добавить сообщение</a>
</div>

<div class="table-responsive">
    <table class="table align-middle bg-white rounded-4 shadow-sm overflow-hidden">
        <thead class="table-light">
            <tr>
                <th>Тема</th>
                <th class="text-end">Действия</th>
            </tr>
        </thead>
        <tbody>
            {% for message in messages %}
            <tr>
                <td>{{ message.subject }}</td>
                <td class="text-end">
                    <a href="{% url 'mailing:message_detail' message.pk %}" class="btn btn-sm btn-outline-primary">Просмотр</a>
                    <a href="{% url 'mailing:message_update' message.pk %}" class="btn btn-sm btn-outline-success">Редактировать</a>
                    <a href="{% url 'mailing:message_delete' message.pk %}" class="btn btn-sm btn-outline-danger">Удалить</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="2" class="text-center text-muted py-4" style="background-color: transparent !important; pointer-events: none;">
                    Сообщений пока нет.
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}

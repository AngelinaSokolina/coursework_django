{% extends 'mailing/base.html' %}

{% block title %}Детали клиента{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm rounded-4 p-4 bg-white" style="max-width: 600px; margin: 0 auto;">
    <h2 class="fw-bold mb-4">{{ client.full_name }}</h2>

    <div class="mb-2">
        <span class="fw-semibold">Email:</span>
        <span>{{ client.email }}</span>
    </div>
    <div class="mb-2">
        <span class="fw-semibold">Ф. И. О.:</span>
        <span>{{ client.full_name }}</span>
    </div>
    <div class="mb-4">
        <span class="fw-semibold">Комментарий:</span>
        <span class="text-muted">{{ client.comment|default:"Нет комментария" }}</span>
    </div>

    <div class="d-flex flex-wrap gap-2 pt-3 border-top">
        <a href="{% url 'mailing:client_update' client.pk %}" class="btn btn-outline-success">Редактировать</a>
        <a href="{% url 'mailing:client_delete' client.pk %}" class="btn btn-outline-danger">Удалить</a>
        <a href="{% url 'mailing:client_list' %}" class="btn btn-outline-primary ms-auto">Назад</a>
    </div>
</div>
{% endblock %}

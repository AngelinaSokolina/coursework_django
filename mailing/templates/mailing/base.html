<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Сервис рассылок{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            background-color: #f0f7f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
        }
        .wrapper {
            flex: 1;
        }
        .navbar {
            background-color: #1a3d2f !important;
            padding: 1.5rem 0;
        }
        .navbar .container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.6rem;
            color: #fff !important;
            letter-spacing: 1px;
            order: 1;
            flex: 0 0 100%;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .navbar-nav {
            order: 2;
        }
        .navbar-nav .nav-link {
            color: #fff !important;
            font-weight: 500;
            padding: 0.5rem 1.5rem;
            border-radius: 30px;
            transition: all 0.2s;
        }
        .navbar-nav .nav-link:hover {
            background-color: #fff;
            color: #1a3d2f !important;
        }
        .navbar-nav .btn-link {
            color: #fff !important;
        }
        .navbar-nav .btn-link:hover {
            background-color: #fff;
            color: #1a3d2f !important;
            border-radius: 30px;
        }
        /* Правый верхний угол — Выйти / Войти / Регистрация */
        .auth-links {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 1rem;
        }
        .auth-links a,
        .auth-links button {
            color: #fff !important;
            font-weight: 500;
            text-decoration: none;
            background: none;
            border: none;
            padding: 0.25rem 0.5rem;
            transition: color 0.2s;
        }
        .auth-links a:hover,
        .auth-links button:hover {
            color: #ccc !important;
        }
        @media (max-width: 768px) {
            .auth-links {
                position: static;
                transform: none;
                justify-content: center;
                margin-top: 0.5rem;
                order: 3;
                flex: 0 0 100%;
            }
            .navbar-brand {
                font-size: 1.3rem;
            }
        }
        .card {
            border: none;
            border-radius: 16px;
            background-color: transparent;
            box-shadow: none;
        }
        .display-1 {
            font-size: 4rem;
            font-weight: 700;
            line-height: 1.2;
        }
        .text-primary {
            color: #1a3d2f !important;
        }
        .text-success {
            color: #2a7a4a !important;
        }
        .text-secondary {
            color: #6c757d !important;
        }
        .border-top {
            border-color: #d0e0d0 !important;
        }
        footer {
            background-color: #1a3d2f;
            color: #fff;
            padding: 1.5rem 0;
            margin-top: auto;
        }
        footer p {
            margin: 0;
            font-size: 0.9rem;
            opacity: 0.7;
        }
        .text-uppercase {
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }
        .mt-6 {
            margin-top: 4rem !important;
        }
        .gap-5 {
            gap: 3rem !important;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <nav class="navbar">
            <div class="container position-relative">
                <!-- Ссылки в правом верхнем углу -->
                <div class="auth-links">
                    {% if user.is_authenticated %}
                        <form method="post" action="{% url 'users:logout' %}">
                            {% csrf_token %}
                            <button type="submit">Выйти</button>
                        </form>
                    {% else %}
                        <a href="{% url 'users:login' %}">Войти</a>
                        <a href="{% url 'users:register' %}">Регистрация</a>
                    {% endif %}
                </div>

                <!-- Название по центру -->
                <a class="navbar-brand" href="{% url 'mailing:home' %}">Сервис рассылок</a>

                <!-- Меню по центру -->
                <ul class="navbar-nav flex-row gap-2">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'mailing:mailing_list' %}">Рассылки</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'mailing:client_list' %}">Клиенты</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'mailing:message_list' %}">Сообщения</a>
                    </li>
                </ul>
            </div>
        </nav>

        <div class="container mt-4">
            {% block content %}{% endblock %}
        </div>
    </div>

    <footer>
        <div class="container text-center">
            <p>© 2026 Сервис рассылок</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
